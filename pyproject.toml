[tool.poetry]
name = "humble-feather"
version = "0.1.0"
description = "PRC Data Challenge 2026 -- taxi-out time prediction"
authors = ["Brian Kimurgor"]
readme = "README.md"
license = "GPL-3.0-or-later"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
duckdb = "*"
polars = "*"
pyarrow = "*"
pytz = "^2026.3.post1"
lightgbm = "^4.7.0"
jupyterlab = "^4.6.4"
matplotlib = "^3.11.2"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
